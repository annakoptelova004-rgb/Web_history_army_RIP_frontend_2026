<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лента</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>

<body>

<div class="phone">

    <div class="feed">

        <video class="feed-video" autoplay muted loop playsinline>
             <source src="http://localhost:9000/media/{{ .order.Video }}" type="video/mp4">
        </video>

        <div class="feed-likes">
            <img src="/static/icons/Vector_liki.svg" alt="Лайк">
            <span>{{ .likesCount }}</span>
        </div>

        <a class="next-button" href="/lenta/{{ .order.ID }}?next=true">
            <span>СЛЕДУЮЩИЙ</span>
             <img src="/static/icons/strela.png" alt="">
        </a>

        <div class="feed-info">
    <h1>{{ .order.Title }}</h1>
    <p>{{ .order.Terrain }} {{ .order.Speed }} км/день</p>
    <p>{{ .order.Description }}</p>
</div>

    </div>

    <nav class="bottom-nav">
        <a href="/lenta">ЛЕНТА</a>
        <a href="/add">ДОБАВЛЕНИЕ</a>
        <a href="/hello">ПЛИТКА</a>
    </nav>

</div>

</body>
</html>
