<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Добавление рода войск</title>
    <link rel="stylesheet" href="/static/styles/style_army.css">
</head>

<body>

<div class="phone">

    <main class="add-page">

        <h1>Добавление</h1>

                        <div class="add-media__box">
                    <img class="add-media__image"
                        src="/static/defaults/default_army.png"
                        alt="Изображение рода войск">
                         </div>

                    <div class="add-media__box">
                    <video class="add-media__video"
                        src="/static/defaults/default_armys.mp4"
                        autoplay
                        muted
                        loop
                        playsinline>
                    </video>
                    </div>

        

        {{ if .hasDraft }}

        <form class="add-fields" method="POST" action="/publish_army">

            <input type="hidden"
                   name="id"
                   value="{{ .draft.ID }}">

            <div class="add-field">
                <label>Название</label>

                <input class="add-input"
                       type="text"
                       name="name"
                       value="{{ .draft.Name }}"
                       readonly>
            </div>

            <div class="add-field">
                <label>Описание</label>

                <textarea class="add-input add-input--description"
                          name="description"
                          required>{{ .draft.Description }}</textarea>
            </div>

            <div class="add-field">
                <label>Скорость по равнине, км/день</label>

                <input class="add-input"
                       type="number"
                       name="speed_plain"
                       value="{{ .draft.SpeedPlain }}"
                       min="0"
                       required>
            </div>

            

            <div class="add-field">
                <label>Питание, кг/день</label>

                <input class="add-input"
                       type="number"
                       name="food"
                       value="{{ .draft.Food }}"
                       min="0"
                       required>
            </div>

            <button class="add-button" type="submit">
                ОПУБЛИКОВАТЬ
            </button>

        </form>

        {{ else }}

        <form class="add-fields"
              method="POST"
              action="/new_army">

            <div class="add-field">
                <label>Название</label>

                <input class="add-input"
                       type="text"
                       name="name"
                       required>
            </div>

            <button class="add-button" type="submit">
                ДАЛЕЕ
            </button>

        </form>

        {{ end }}

    </main>

    <nav class="bottom-nav">
        <a href="/army">ЛЕНТА</a>
        <a href="/new_army">ДОБАВЛЕНИЕ</a>
        <a href="/military_branch">ПЛИТКА</a>
    </nav>

</div>

</body>

</html>
