<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>

<body>

<div class="phone">

    <main class="add-page">

        <h1>Добавление</h1>

        <div class="add-media">
            <div class="add-media__box">
                <span>+ изображение</span>
            </div>

            <div class="add-media__box">
                <span>+ видео</span>
            </div>
        </div>

       <div class="add-fields">

    <div class="add-field">
        <label>Название</label>
        <input class="add-input" type="text" value="{{ .order.Title }}">
    </div>

    <div class="add-field">
        <label>Описание</label>
        <textarea class="add-input add-input--description">{{ .order.Description }}</textarea>
    </div>

    <div class="add-field">
        <label>Местность</label>
        <input class="add-input" type="text" value="{{ .order.Terrain }}">
    </div>

    <div class="add-field">
        <label>Скорость, км/день</label>
        <input class="add-input" type="number" value="{{ .order.Speed }}">
    </div>

    <div class="add-status">
        Статус: {{ .order.Status }}
    </div>

</div>

    </main>

    <nav class="bottom-nav">
        <a href="/lenta">ЛЕНТА</a>
        <a href="/add">ДОБАВЛЕНИЕ</a>
        <a href="/hello">ПЛИТКА</a>
    </nav>

</div>

</body>
</html>
